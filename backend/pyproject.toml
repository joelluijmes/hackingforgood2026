[project]
name = "icf-studio-backend"
version = "0.1.0"
description = "ICF Studio backend (hackathon)"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "python-multipart>=0.0.9",
    "python-docx>=1.1",
]

[dependency-groups]
dev = ["ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
